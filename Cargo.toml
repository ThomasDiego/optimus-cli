[package]
name = "ai"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cap-std = "4.0.3"
globset = "0.4.21"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "sync"] }
toml = "1.1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
